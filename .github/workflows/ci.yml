name: CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: 🐍 Python Backend Tests
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:v1.7.4
        ports:
          - 6333:6333
          - 6334:6334

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Backend Pytest Suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'mock_groq_key_for_testing' }}
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
        run: |
          pytest test/test_retrievers.py test/test_llm_clients.py test/test_evaluation.py test/test_workflow.py test/test_api.py test/test_memory_thread.py -v

  frontend-build:
    name: ⚛️ Next.js Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Node Dependencies
        run: npm install

      - name: Next.js Production Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
